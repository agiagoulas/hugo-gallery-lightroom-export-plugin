name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two suites are plain Lua with no fixtures. LuaJIT rather than lua5.1
      # because that is what the plugin runs under inside Lightroom.
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: make test
