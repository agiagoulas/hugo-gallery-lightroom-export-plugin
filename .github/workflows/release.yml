name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - id: version
        run: |
          v=$(luajit -e 'local i = dofile("HugoGalleryExportPlugin.lrdevplugin/Info.lua")
            io.write(("%d.%d.%d"):format(i.VERSION.major, i.VERSION.minor, i.VERSION.revision))')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Manifest version: v$v"
      - id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.release == 'true'
        run: make test
      - if: steps.check.outputs.release == 'true'
        run: |
          zip -r "HugoGalleryExportPlugin-${{ steps.version.outputs.tag }}.zip" HugoGalleryExportPlugin.lrdevplugin \
            -x '*.DS_Store'
      - if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "HugoGalleryExportPlugin-${{ steps.version.outputs.tag }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
